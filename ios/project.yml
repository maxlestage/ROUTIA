# Le projet Xcode de Routia, généré par XcodeGen : `xcodegen generate` puis ouvrir
# Routia.xcodeproj. La logique (séries, historique, export) est dans le paquet local
# RoutiaCore, testé aussi sous Linux.
name: Routia
options:
  bundleIdPrefix: app.routia
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  RoutiaCore:
    path: RoutiaCore
targets:
  Routia:
    type: application
    platform: iOS
    sources:
      - Routia
    dependencies:
      - package: RoutiaCore
    info:
      path: Routia/Info.plist
      properties:
        CFBundleDisplayName: Routia
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.routia.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Routia:
    build:
      targets:
        Routia: all
    test:
      targets: []
